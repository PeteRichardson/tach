[project]
name = "tach"
version = "0.1.0"
description = "Small USB display that shows live CPU, GPU and memory use of a Mac"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pete Richardson", email = "pete@peterichardson.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "circup>=3.1.0",
]
