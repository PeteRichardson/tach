[project]
name = "tach"
version = "0.1.0"
description = "Small USB display that shows live CPU, GPU and memory use of a Mac"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pete Richardson", email = "pete@peterichardson.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",  # import layout
    "E7",  # statement style
    "E9",  # syntax and undefined names
    "F",   # pyflakes: unused code, undefined names
    "B",   # bugbear: loop-variable capture, lost exceptions, zip length
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    # .format() is the house style in tach-sender.py. Converting it to
    # f-strings is issue #29, deliberately kept out of the v1 retirement.
    # (v1's CircuitPython code, which also needed the ignore, is gone.)
    "UP032",
]
