# CI on pull requests and on merges to main. Feature branches without an open
# PR are covered when the PR opens.
#
# pytest runs on macos-latest: tach-sender.py is a macOS tool (libSystem
# host_statistics64, macmon), and tests/test_memory.py::test_live_used_gb_
# is_within_total exercises the real ctypes path against the kernel. That
# test skips itself off macOS, but the rest of the suite only proves what it
# claims when it runs on the platform the product runs on. Ruff is
# platform-independent and bills 10x on macOS, so it gets its own Linux job.
#
# The firmware tests run on Linux too: device/host-tests compiles the pure
# firmware modules (wire, chart, framebuf, layout, ops) for the host, so they
# need neither the RP2350 target nor a Mac. Run from the repository root, so
# device/.cargo/config.toml does not force the thumb target.
#
# setup-uv publishes no major tags from v8 on, and its maintainers ask for a
# pin to a commit; the comment gives the release. Both actions run on Node 24.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Pytest
        run: uv run pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cargo test
        run: cargo test --manifest-path device/host-tests/Cargo.toml
